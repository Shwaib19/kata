name: Backend tests

on:
  push:
    branches: [master]
    paths:
      - 'Kata-api/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'Kata-api/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Kata-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kata.sln

      - name: Build
        run: dotnet build Kata.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Kata.sln --no-build --configuration Release --verbosity normal
